{% extends "base.html" %}
{% block content %}
<div class="page-wrapper" style="max-width:560px">
  <div class="page-header">
    <div class="page-title">➕ Yeni Maç Ekle</div>
  </div>

  <div class="card">
    <form method="POST" action="{{ url_for('admin.create_match') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Ev Sahibi Takım</label>
          <input name="home_team" class="form-control" placeholder="Türkiye" required>
        </div>
        <div class="form-group">
          <label class="form-label">Deplasman Takım</label>
          <input name="away_team" class="form-control" placeholder="Almanya" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Maç Başlangıç</label>
          <input type="datetime-local" name="start_time" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Aşama</label>
          <select name="stage" class="form-control">
            <option>Group Stage</option>
            <option>Round of 32</option>
            <option>Round of 16</option>
            <option>Quarter-final</option>
            <option>Semi-final</option>
            <option>Third Place</option>
            <option>Final</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Stat / Şehir</label>
        <input name="venue" class="form-control" placeholder="MetLife Stadium, New York">
      </div>

      <div style="display:flex; gap:.75rem">
        <button type="submit" class="btn btn-primary">✅ Maç Ekle</button>
        <a class="btn btn-outline" href="{{ url_for('admin.matches') }}">İptal</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
