{% extends "base.html" %}
{% block content %}
<div class="page-wrapper" style="max-width:440px">
  <div class="page-header">
    <div class="page-title">🔒 Parola Değiştir</div>
  </div>

  <div class="card">
    <form method="POST" action="{{ url_for('auth.change_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label">Mevcut Parola</label>
        <input type="password" name="current_password" class="form-control"
               placeholder="Mevcut parolanız" required>
      </div>

      <div class="form-group">
        <label class="form-label">Yeni Parola</label>
        <input type="password" name="new_password" class="form-control"
               placeholder="En az 8 karakter" required>
      </div>

      <div class="form-group">
        <label class="form-label">Yeni Parola (Tekrar)</label>
        <input type="password" name="confirm_password" class="form-control"
               placeholder="Yeni parolayı tekrar girin" required>
      </div>

      <button type="submit" class="btn btn-primary w-full"
              style="justify-content:center; padding:.8rem">
        Parolayı Güncelle
      </button>
    </form>
  </div>
</div>
{% endblock %}
